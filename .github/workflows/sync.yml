name: Synchro & publication

# Met à jour les données Netatmo et republie le site, sans dépendre du Mac.
on:
  schedule:
    - cron: "17 */6 * * *"   # toutes les 6 heures
  workflow_dispatch:          # + bouton "Run workflow" manuel

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Réutilise la base d'une exécution à l'autre (synchro incrémentale)
      - name: Restaurer la base de données
        uses: actions/cache@v4
        with:
          path: data.db
          key: netatmo-db-${{ github.run_id }}
          restore-keys: |
            netatmo-db-

      - name: Synchroniser puis exporter le site
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: |
          python sync.py
          python export.py

      - name: Publier les nouvelles données
        run: |
          git config user.name "netatmo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Rien de neuf à publier."
            exit 0
          fi
          git commit -m "maj auto $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push
